name: Hello World Training Workflow
on:
  workflow_dispatch
jobs:
    greet:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout repository
            uses: actions/checkout@v4
          - name: List repository files
            run: ls
          - name: Read README
            run: cat README.md
          - name: Greet the user
            run: echo "Hello World!"
            
